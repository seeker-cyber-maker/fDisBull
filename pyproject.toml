[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdisbull"
version = "0.34.1"
description = "Agent-first disassembly, persistent evidence and headless rendering"
requires-python = ">=3.12"
dependencies = ["iced-x86==1.21.0", "capstone==5.0.9", "lief==1.0.0", "Pillow>=10.4,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "setuptools>=68", "dnfile==0.18.0", "dncil==1.0.2", "z3-solver==5.3.2.0", "unicorn==2.1.4", "pycparser==3.12", "zstandard>=0.23,<1"]
proof = ["z3-solver==5.3.2.0"]
udc = ["unicorn==2.1.4"]
managed = ["dnfile==0.18.0", "dncil==1.0.2"]
source = ["tree-sitter==0.25.2", "tree-sitter-c==0.24.1"]
console = ["pycparser==3.12"]
screenshot = ["zstandard>=0.23,<1"]

[project.scripts]
fdisbull = "fdisbull.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools.package-data]
fdisbull = ["wine_guest/*.c", "wine_guest/*.sh", "wine_guest/*.py", "ida_guest/*.c", "ida_guest/*.sh", "ida_guest/*.py", "ida_guest/SDK-LICENSE.txt", "dos_guest/*.sh", "dos_guest/*.py", "native_runtime/*.c", "native_runtime/*.h", "native_runtime/*.m", "web_runtime/*.mjs", "web_runtime/*.html", "ghidra_scripts/*.java", "game_sources/*.c", "game_sources/*.m", "game_sources/*.s", "game_sources/*.S", "game_sources/*.cfg", "game_sources/*.txt", "data/*.json", "data/*.txt", "data/*.swift", "skills/*/*.md", "skills/*/references/*.md"]
