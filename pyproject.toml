[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdisbull"
version = "0.9.0"
description = "Agent-first disassembly, persistent evidence and headless rendering"
requires-python = ">=3.12"
dependencies = ["iced-x86==1.21.0", "capstone==5.0.9", "lief==1.0.0", "Pillow>=10.4,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "dnfile==0.18.0", "dncil==1.0.2"]
managed = ["dnfile==0.18.0", "dncil==1.0.2"]

[project.scripts]
fdisbull = "fdisbull.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
