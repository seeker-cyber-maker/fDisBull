# GitLab CI/CD configuration for fDisBull (30-day trial safe configuration).
#
# Anti-abuse and quota-protection guarantees:
# 1. Feature, agent, and archive branch pushes NEVER start automatic pipelines.
# 2. Draft Merge Requests skip automatic runs unless FDISBULL_RUN_DRAFT_CI=1.
# 3. Ready Merge Requests, default-branch (main) pushes, v* release tags, and
#    explicit web/API dispatches run the fast `test-and-package` gate.
# 4. Heavy 45-minute C++ emulator compilation (`native-debugger-*`) NEVER runs
#    automatically on ordinary pushes/MRs; it requires explicit manual play or
#    FDISBULL_RUN_NATIVE_CI=1 during pre-release qualification.
# 5. Jobs are interruptible, serialized per ref via resource_group, and never
#    auto-retry on failure.

workflow:
  name: "fDisBull CI ($CI_PIPELINE_SOURCE / $CI_COMMIT_REF_NAME)"
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[(skip ci|ci skip)\]/i'
      when: never
    - if: '$FDISBULL_DISABLE_CI == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/i && $FDISBULL_RUN_DRAFT_CI != "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: always
    - when: never

default:
  image: python:3.12-slim
  interruptible: true
  timeout: 20m
  retry: 0

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  key: "pip-py312-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

stages:
  - verify
  - native-qualification

test-and-package:
  stage: verify
  resource_group: "fdisbull-verify-$CI_COMMIT_REF_SLUG"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git gcc nodejs
  script:
    - python -m pip install --upgrade pip
    - python -m pip install ".[test,source]" build
    - python -m pytest -q
    - python -m build
    - python -m build --wheel ./player --outdir dist
    - |
      RUNNER_TEMP="$(mktemp -d)"
      python -m venv --system-site-packages "$RUNNER_TEMP/fdisbull-skill-gate"
      "$RUNNER_TEMP/fdisbull-skill-gate/bin/python" -m pip install --no-index --no-deps --force-reinstall dist/fdisbull-*.whl
      mkdir -p artifacts/receipts
      python scripts/check_agent_skill.py --python "$RUNNER_TEMP/fdisbull-skill-gate/bin/python" --output artifacts/receipts/fdisbull-skill-gate-receipt.json
      python scripts/check_agent_skill.py --python "$RUNNER_TEMP/fdisbull-skill-gate/bin/python" --skill write-gamefaqs-guide --output artifacts/receipts/fdisbull-guide-skill-gate-receipt.json
      python -m venv "$RUNNER_TEMP/fdisbull-player-smoke"
      "$RUNNER_TEMP/fdisbull-player-smoke/bin/python" -m pip install --no-index --no-deps dist/fdisbull_player-*.whl
      "$RUNNER_TEMP/fdisbull-player-smoke/bin/python" -I -c "import importlib.util; import fdisbull_player; assert importlib.util.find_spec('fdisbull') is None"
      "$RUNNER_TEMP/fdisbull-player-smoke/bin/python" -I -m fdisbull_player --help
      rm -rf "$RUNNER_TEMP"
    - python scripts/check_dist.py
    - python scripts/build_release.py
    - python scripts/check_dist.py
  artifacts:
    name: "fdisbull-packages-$CI_COMMIT_SHORT_SHA"
    when: on_success
    expire_in: 7 days
    paths:
      - dist/*
      - artifacts/receipts/*.json

.native_debugger_template:
  stage: native-qualification
  image: ubuntu:24.04
  timeout: 45m
  resource_group: "fdisbull-native-$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$FDISBULL_RUN_NATIVE_CI == "1"'
      when: on_success
      allow_failure: false
    - when: manual
      allow_failure: true
  script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git python3 python3-pip python3-venv build-essential autoconf automake pkg-config nasm llvm ffmpeg libsdl2-dev libsdl2-net-dev libncurses-dev libpng-dev zlib1g-dev libfreetype6-dev
    - git clone --no-checkout https://github.com/joncampbell123/dosbox-x.git .native/dosbox-x
    - git -C .native/dosbox-x checkout 029bd65c5dcc7cdc7f2e14e35278620d9707d969
    - |
      python3 - <<'PY'
      import hashlib, json, os, subprocess
      from pathlib import Path
      checkout = Path('.native/dosbox-x').resolve()
      directory = Path(os.environ['FDISBULL_PATCH_DIRECTORY']).resolve()
      manifest = json.loads((directory / 'source-manifest.json').read_text())
      head = subprocess.check_output(['git', '-C', str(checkout), 'rev-parse', 'HEAD'], text=True).strip()
      assert head == manifest['baseline_commit'], 'Wrong upstream baseline'
      patch = directory / 'headless-agent.patch'
      assert hashlib.sha256(patch.read_bytes()).hexdigest() == manifest['patch_sha256'], 'Patch hash mismatch'
      subprocess.run(['git', '-C', str(checkout), 'apply', '--check', str(patch)], check=True)
      subprocess.run(['git', '-C', str(checkout), 'apply', str(patch)], check=True)
      for item in manifest['source_files']:
          path = checkout / item['path']
          assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], item['path']
      print(f"Verified {len(manifest['source_files'])} patched source files against the declared manifest")
      PY
    - (cd .native/dosbox-x && ./autogen.sh && ./configure --enable-debug=heavy --disable-sdl2test --disable-alsatest && make -j"$(nproc)")
    - python3 -m venv .native-venv
    - .native-venv/bin/pip install ".[test]" build
    - FDISBULL_DOSBOX="$CI_PROJECT_DIR/.native/dosbox-x/src/dosbox-x" FDISBULL_DOSBOX_SOURCE="$CI_PROJECT_DIR/.native/dosbox-x" .native-venv/bin/pytest -q $FDISBULL_NATIVE_TESTS

native-debugger-stable:
  extends: .native_debugger_template
  variables:
    FDISBULL_PATCH_DIRECTORY: "experimental/dosbox-x"
    FDISBULL_NATIVE_TESTS: "tests/test_debugger.py tests/test_dos_guest_exit.py tests/test_dos_com.py tests/test_keyboard.py tests/test_screenshot_grid.py tests/test_scenes.py tests/test_scene_improvements.py"

native-debugger-layers:
  extends: .native_debugger_template
  variables:
    FDISBULL_PATCH_DIRECTORY: "experimental/dosbox-x/layers"
    FDISBULL_NATIVE_TESTS: "tests/test_debugger.py tests/test_dos_guest_exit.py tests/test_dos_com.py tests/test_dos_launch.py tests/test_run_boundaries.py tests/test_keyboard.py tests/test_debug_wait.py tests/test_code_layers.py tests/test_debug_experiments.py tests/test_runtime_code.py tests/test_debug_semantics.py tests/test_doctor.py"
