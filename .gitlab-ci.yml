# GitLab CI/CD configuration for fDisBull (30-day trial safe configuration).
#
# Anti-abuse and quota-protection guarantees:
# 1. Feature, agent, and archive branch pushes NEVER start automatic pipelines.
# 2. Draft Merge Requests skip automatic runs. Explicit API/web pipelines work
#    without pipeline-variable overrides (which the project may prohibit).
# 3. Ready Merge Requests, default-branch (main) pushes, v* release tags, and
#    explicit web/API dispatches run the fast `test-and-package` gate.
# 4. Heavy 45-minute C++ emulator compilation (`native-debugger-*`) NEVER runs
#    automatically on ordinary pushes/MRs; an API/web pipeline waits for one
#    blocking manual start before running the required native chain.
# 5. Only superseded MR checks are interruptible; qualification runs are retained.

workflow:
  name: "fDisBull CI ($CI_PIPELINE_SOURCE / $CI_COMMIT_REF_NAME)"
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[(skip ci|ci skip)\]/i'
      when: never
    - if: '$FDISBULL_DISABLE_CI == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(\[Draft\]|\(Draft\)|Draft:)/i'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
      when: always
    - when: never

default:
  image: python:3.12-slim-bookworm
  interruptible: false
  timeout: 20m
  retry: 0

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"

cache:
  key: "pip-py312-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

stages:
  - verify
  - native-gate
  - native-qualification
  - native-unified
  - qualification

test-and-package:
  stage: verify
  timeout: 40m
  resource_group: "fdisbull-verify-$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      interruptible: true
    - when: on_success
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl xz-utils git build-essential clang libx11-dev
  script:
    - bash scripts/ci/test-and-package.sh
  artifacts:
    name: "fdisbull-packages-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 7 days
    paths:
      - dist/*
      - artifacts/receipts/*.json
      - artifacts/ordinary/
    reports:
      junit: artifacts/ordinary/tests.xml

# A deliberate API or web pipeline has one blocking manual start. Ordinary
# MR, main and tag pipelines have no unplayed native jobs.
.native_qualification_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never

native-qualification:
  stage: native-gate
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - 'echo "Starting native qualification for $CI_COMMIT_SHA"'

.native_debugger_template:
  extends: .native_qualification_rules
  stage: native-qualification
  interruptible: false
  timeout: 60m
  needs:
    - native-qualification
    - job: test-and-package
      artifacts: true
  variables:
    FDISBULL_DOSBOX: "$CI_PROJECT_DIR/.native/backends/$FDISBULL_PROFILE/dosbox-x"
    FDISBULL_DOSBOX_SOURCE: "$CI_PROJECT_DIR/.native/dosbox-x"
    FDISBULL_FRAME_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/frame-capture"
  script:
    - bash scripts/ci/native-debugger.sh
    - python scripts/ci/native-receipt.py "$FDISBULL_PROFILE"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - native-evidence/
      - artifacts/receipts/native-*.json
      - .native/offline/output/
      - .native/backends/
    reports:
      junit: native-evidence/$FDISBULL_PROFILE/tests.xml

native-debugger-stable:
  extends: .native_debugger_template
  image: python:3.12-bookworm
  variables:
    FDISBULL_PROFILE: stable
    FDISBULL_PATCH_DIRECTORY: experimental/dosbox-x

native-debugger-layers:
  extends: .native_debugger_template
  image: python:3.13.5-bookworm
  variables:
    FDISBULL_PROFILE: layers
    FDISBULL_PATCH_DIRECTORY: experimental/dosbox-x/layers

native-unified:
  extends: .native_qualification_rules
  stage: native-unified
  image: python:3.12-bookworm
  interruptible: false
  timeout: 90m
  needs:
    - job: test-and-package
      artifacts: true
    - job: native-debugger-stable
      artifacts: false
    - job: native-debugger-layers
      artifacts: true
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    FDISBULL_PE_QEMU: "$CI_PROJECT_DIR/.native/pe/qemu-9.2.4/build/qemu-system-x86_64"
    FDISBULL_PE_KERNEL: "$CI_PROJECT_DIR/.native/pe/linux-amd64"
    FDISBULL_PE_INITRAMFS: "$CI_PROJECT_DIR/.native/pe/runtime.cpio.gz"
    FDISBULL_PE_FIXTURE: "$CI_PROJECT_DIR/.native/pe/oracle.exe"
    FDISBULL_PE_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/pe/artifacts"
    FDISBULL_REQUIRE_PE: "1"
    FDISBULL_DOSBOX: "$CI_PROJECT_DIR/.native/backends/layers/dosbox-x"
    FDISBULL_MACHINE_QEMU: "$CI_PROJECT_DIR/.native/pe/qemu-9.2.4/build/qemu-system-x86_64"
    FDISBULL_DOS_KERNEL: "$CI_PROJECT_DIR/.native/pe/linux-amd64"
    FDISBULL_DOS_INITRAMFS: "$CI_PROJECT_DIR/.native/pe/dos-runtime.cpio.gz"
    FDISBULL_MACHINE_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/unified/boot"
    FDISBULL_DOS_QEMU_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/unified/dos"
    FDISBULL_REQUIRE_MACHINE: "1"
    FDISBULL_REQUIRE_DOS_QEMU: "1"
  script:
    - bash scripts/ci/native-unified.sh
    - python scripts/ci/native-receipt.py unified
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - native-evidence/pe/
      - native-evidence/unified/
      - artifacts/receipts/native-unified.json
      - .native/pe/packages/*.whl
    reports:
      junit:
        - native-evidence/pe/tests.xml
        - native-evidence/unified/tests.xml

qualify-candidate:
  extends: .native_qualification_rules
  stage: qualification
  image: python:3.12-slim-bookworm
  interruptible: false
  timeout: 10m
  needs:
    - test-and-package
    - native-debugger-stable
    - native-debugger-layers
    - native-unified
  script:
    - python scripts/check_ci_qualification.py --output artifacts/receipts/qualification.json
  artifacts:
    when: on_success
    name: "fdisbull-qualified-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - artifacts/receipts/
      - dist/
      - .native/offline/output/
      - .native/backends/
      - .native/pe/packages/*.whl
      - artifacts/ordinary/tests.xml
      - native-evidence/stable/tests.xml
      - native-evidence/layers/tests.xml
      - native-evidence/pe/tests.xml
      - native-evidence/unified/tests.xml
