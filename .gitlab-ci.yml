# Local-first CI: pushes, merge requests and tags do not create pipelines.
# Only deliberate web/API pipelines are admitted, and every job requires the
# dedicated local-runner tag. Heavy qualification has a blocking manual start.
workflow:
  name: "fDisBull CI ($CI_PIPELINE_SOURCE / $CI_COMMIT_REF_NAME)"
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[(skip ci|ci skip)\]/i'
      when: never
    - if: '$FDISBULL_DISABLE_CI == "1"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"'
      when: always
    - when: never

default:
  image: python:3.12-slim-bookworm
  tags:
    - fdisbull-local-linux
    - fdisbull-ovh-ca
  interruptible: false
  before_script:
    - git --version
    - python scripts/ci/ovh-admission.py
  after_script:
    - python scripts/ci/ovh-export.py export --work "$CI_PROJECT_DIR" --root /ci-host-results
  timeout: 20m
  retry: 0

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  FDISBULL_EXPECTED_BYTES: "500000000"

cache:
  key: "pip-py312-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip

stages:
  - verify
  - native-gate
  - native-qualification
  - native-unified
  - qualification

test-and-package:
  resource_group: fdisbull-ovh-ci
  stage: verify
  timeout: 40m
  variables:
    FDISBULL_EXPECTED_BYTES: "12000000000"
  before_script:
    - python scripts/ci/ovh-admission.py
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl xz-utils git build-essential clang libx11-dev pkg-config zlib1g-dev libzstd-dev
  script:
    - bash scripts/ci/test-and-package.sh
  artifacts:
    name: "fdisbull-packages-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: never
    paths:
      - dist/*
      - artifacts/receipts/*.json
      - artifacts/ordinary/
    reports:
      junit: artifacts/ordinary/tests.xml

# A deliberate API or web pipeline has one blocking manual native start.
.native_qualification_rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
      when: on_success
    - when: never

native-qualification:
  resource_group: fdisbull-ovh-ci
  stage: native-gate
  image: python:3.12-bookworm
  interruptible: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  script:
    - 'echo "Starting native qualification for $CI_COMMIT_SHA"'

.native_debugger_template:
  resource_group: fdisbull-ovh-ci
  extends: .native_qualification_rules
  stage: native-qualification
  interruptible: false
  timeout: 60m
  needs:
    - native-qualification
    - job: test-and-package
      artifacts: true
  variables:
    FDISBULL_DOSBOX: "$CI_PROJECT_DIR/.native/backends/$FDISBULL_PROFILE/dosbox-x"
    FDISBULL_DOSBOX_SOURCE: "$CI_PROJECT_DIR/.native/dosbox-x"
    FDISBULL_FRAME_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/frame-capture"
  script:
    - bash scripts/ci/native-debugger.sh
    - python scripts/ci/native-receipt.py "$FDISBULL_PROFILE"
  artifacts:
    when: always
    expire_in: never
    paths:
      - native-evidence/
      - artifacts/receipts/native-*.json
      - artifacts/receipts/ovh-*.json
      - .native/offline/output/
      - .native/backends/
    reports:
      junit: native-evidence/$FDISBULL_PROFILE/tests.xml

native-debugger-stable:
  extends: .native_debugger_template
  image: python:3.12-bookworm
  variables:
    FDISBULL_EXPECTED_BYTES: "14000000000"
    FDISBULL_PROFILE: stable
    FDISBULL_PATCH_DIRECTORY: experimental/dosbox-x

native-debugger-layers:
  extends: .native_debugger_template
  image: python:3.13.5-bookworm
  variables:
    FDISBULL_EXPECTED_BYTES: "18000000000"
    FDISBULL_PROFILE: layers
    FDISBULL_PATCH_DIRECTORY: experimental/dosbox-x/layers

native-unified:
  resource_group: fdisbull-ovh-ci
  extends: .native_qualification_rules
  stage: native-unified
  image: python:3.12-bookworm
  interruptible: false
  timeout: 3h
  needs:
    - job: test-and-package
      artifacts: true
    - job: native-debugger-stable
      artifacts: false
    - job: native-debugger-layers
      artifacts: true
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--storage-driver=vfs"]
  variables:
    # Independent TCG guests exceeded 90 minutes on the OVH worker. Reserve
    # time for after_script export and artifact upload even on script timeout.
    RUNNER_SCRIPT_TIMEOUT: "2h40m"
    RUNNER_AFTER_SCRIPT_TIMEOUT: "10m"
    FDISBULL_EXPECTED_BYTES: "35000000000"
    DOCKER_BUILDKIT: "0"
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    FDISBULL_PE_QEMU: "$CI_PROJECT_DIR/.native/pe/qemu-9.2.4/build/qemu-system-x86_64"
    FDISBULL_PE_KERNEL: "$CI_PROJECT_DIR/.native/pe/linux-amd64"
    FDISBULL_PE_INITRAMFS: "$CI_PROJECT_DIR/.native/pe/runtime.cpio.gz"
    FDISBULL_PE_FIXTURE: "$CI_PROJECT_DIR/.native/pe/oracle.exe"
    FDISBULL_PE_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/pe/artifacts"
    FDISBULL_REQUIRE_PE: "1"
    FDISBULL_DOSBOX: "$CI_PROJECT_DIR/.native/backends/layers/dosbox-x"
    FDISBULL_MACHINE_QEMU: "$CI_PROJECT_DIR/.native/pe/qemu-9.2.4/build/qemu-system-x86_64"
    FDISBULL_DOS_KERNEL: "$CI_PROJECT_DIR/.native/pe/linux-amd64"
    FDISBULL_DOS_INITRAMFS: "$CI_PROJECT_DIR/.native/pe/dos-runtime.cpio.gz"
    FDISBULL_MACHINE_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/unified/boot"
    FDISBULL_DOS_QEMU_EVIDENCE: "$CI_PROJECT_DIR/native-evidence/unified/dos"
    FDISBULL_REQUIRE_MACHINE: "1"
    FDISBULL_REQUIRE_DOS_QEMU: "1"
  script:
    - bash scripts/ci/native-unified.sh
    - python scripts/ci/native-receipt.py unified
  artifacts:
    when: always
    expire_in: never
    paths:
      - native-evidence/pe/
      - native-evidence/unified/
      - artifacts/receipts/native-unified.json
      - artifacts/receipts/ovh-*.json
      - .native/pe/packages/*.whl
    reports:
      junit:
        - native-evidence/pe/tests.xml
        - native-evidence/unified/tests.xml

qualify-candidate:
  resource_group: fdisbull-ovh-ci
  extends: .native_qualification_rules
  stage: qualification
  image: python:3.12-bookworm
  interruptible: false
  timeout: 10m
  needs:
    - test-and-package
    - native-debugger-stable
    - native-debugger-layers
    - native-unified
  script:
    - python scripts/ci/ovh-export.py verify --work "$CI_PROJECT_DIR" --root /ci-host-results
    # This graph qualifies ordinary/native core only; complete chat delivery is separate.
    - python scripts/check_ci_qualification.py --output artifacts/receipts/qualification.json --legacy-dos-only
  artifacts:
    when: on_success
    name: "fdisbull-qualified-$CI_COMMIT_SHORT_SHA"
    expire_in: never
    paths:
      - artifacts/receipts/
      - dist/
      - .native/offline/output/
      - .native/backends/
      - .native/pe/packages/*.whl
      - artifacts/ordinary/tests.xml
      - native-evidence/stable/tests.xml
      - native-evidence/layers/tests.xml
      - native-evidence/pe/tests.xml
      - native-evidence/unified/tests.xml
