[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fdisbull-player"
version = "0.26.1"
description = "Standalone deterministic text player for declared scene slices"
readme = {text = "Standalone fDisBull player for authored projections and compatible endpoints. No game files, emulator or analysis engine is included. See https://github.com/seeker-cyber-maker/fDisBull for usage and backend requirements.", content-type = "text/markdown"}
requires-python = ">=3.10"

[project.scripts]
fdisbull-player = "fdisbull_player.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fdisbull_player", "fdisbull_player.*"]
exclude = ["build", "build.*", "tests", "tests.*", "examples", "examples.*"]
