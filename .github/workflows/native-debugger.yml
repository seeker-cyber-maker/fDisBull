name: Native debugger acceptance

on:
  push:
    paths:
      - .github/workflows/native-debugger.yml
      - experimental/dosbox-x/**
      - experimental/wine/ci/**
      - src/fdisbull/**
      - tests/**
      - pyproject.toml
  pull_request:
    paths:
      - .github/workflows/native-debugger.yml
      - experimental/dosbox-x/**
      - experimental/wine/ci/**
      - src/fdisbull/**
      - tests/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-debugger:
    name: Native debugger (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: stable-backend
            patch_directory: experimental/dosbox-x
            python_version: "3.12"
            tests: tests/test_debugger.py tests/test_dos_com.py tests/test_keyboard.py tests/test_screenshot_grid.py tests/test_scenes.py tests/test_scene_improvements.py tests/test_input_macros.py tests/test_movement.py tests/test_runtime_observations.py tests/test_scene_readiness.py
          - profile: layers-backend
            patch_directory: experimental/dosbox-x/layers
            python_version: "3.13.5"
            tests: tests/test_debugger.py tests/test_dos_com.py tests/test_dos_launch.py tests/test_run_boundaries.py tests/test_keyboard.py tests/test_debug_wait.py tests/test_code_layers.py tests/test_debug_experiments.py tests/test_runtime_code.py tests/test_debug_semantics.py tests/test_doctor.py tests/test_screenshot_grid.py tests/test_screenshot_hooks.py tests/test_scenes.py tests/test_scene_improvements.py tests/test_scene_layers.py tests/test_ida_dosbox.py tests/test_dosbox_zip_stream.py tests/test_library_catalog.py tests/test_rich_types.py tests/test_dos_services.py tests/test_input_macros.py tests/test_movement.py tests/test_runtime_observations.py tests/test_scene_readiness.py
    env:
      FDISBULL_DOSBOX: ${{ github.workspace }}/.native/dosbox-x/src/dosbox-x
      FDISBULL_DOSBOX_SOURCE: ${{ github.workspace }}/.native/dosbox-x
      FDISBULL_PATCH_DIRECTORY: ${{ matrix.patch_directory }}
      FDISBULL_NATIVE_TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joncampbell123/dosbox-x
          ref: 029bd65c5dcc7cdc7f2e14e35278620d9707d969
          path: .native/dosbox-x
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake pkg-config nasm \
            libsdl2-dev libsdl2-net-dev libncurses-dev libpng-dev zlib1g-dev libfreetype6-dev
          python -m pip install ".[test]"
      - name: Verify pinned baseline and apply the complete patch
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          checkout=Path('.native/dosbox-x').resolve()
          directory=Path(os.environ['FDISBULL_PATCH_DIRECTORY']).resolve()
          manifest=json.loads((directory/'source-manifest.json').read_text())
          head=subprocess.check_output(['git','-C',str(checkout),'rev-parse','HEAD'],text=True).strip()
          assert head==manifest['baseline_commit'], 'Wrong upstream baseline'
          patch=directory/'headless-agent.patch'
          assert hashlib.sha256(patch.read_bytes()).hexdigest()==manifest['patch_sha256'], 'Patch hash mismatch'
          subprocess.run(['git','-C',str(checkout),'apply','--check',str(patch)],check=True)
          subprocess.run(['git','-C',str(checkout),'apply',str(patch)],check=True)
          for item in manifest['source_files']:
              path=checkout/item['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256'], item['path']
          print(f"Verified {len(manifest['source_files'])} patched source files against the declared manifest")
          PY
      - name: Build the native heavy-debug backend
        working-directory: .native/dosbox-x
        run: |
          ./autogen.sh
          ./configure --enable-sdl2 --enable-debug=heavy --enable-dosbox_agent \
            --disable-avcodec --disable-libslirp --disable-libfluidsynth
          make -j2
      - name: Record the tested backend identity
        run: |
          mkdir -p native-evidence
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          executable=Path(os.environ['FDISBULL_DOSBOX'])
          patch=Path(os.environ['FDISBULL_PATCH_DIRECTORY'])/'headless-agent.patch'
          receipt={'source_commit':os.environ['GITHUB_SHA'],
                   'upstream_commit':'029bd65c5dcc7cdc7f2e14e35278620d9707d969',
                   'backend_sha256':hashlib.sha256(executable.read_bytes()).hexdigest(),
                   'patch_sha256':hashlib.sha256(patch.read_bytes()).hexdigest(),
                   'profile':os.environ['FDISBULL_PATCH_DIRECTORY'],
                   'acceptance_tests':os.environ['FDISBULL_NATIVE_TESTS'].split()}
          Path('native-evidence/backend-identity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Run existing tests with a required native backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --require-native $FDISBULL_NATIVE_TESTS \
            --junitxml=native-evidence/tests.xml 2>&1 | tee native-evidence/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debugger-${{ matrix.profile }}
          path: native-evidence/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success() && matrix.profile == 'layers-backend'
        with:
          name: linux-dosbox-layers
          path: .native/dosbox-x/src/dosbox-x
          if-no-files-found: error

  pe64-debugger:
    name: Unified DOS, boot and PE64 (installed wheel)
    needs: native-debugger
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FDISBULL_PE_QEMU: ${{ github.workspace }}/.native/pe/qemu-9.2.4/build/qemu-system-x86_64
      FDISBULL_PE_KERNEL: ${{ github.workspace }}/.native/pe/linux-amd64
      FDISBULL_PE_INITRAMFS: ${{ github.workspace }}/.native/pe/runtime.cpio.gz
      FDISBULL_PE_FIXTURE: ${{ github.workspace }}/.native/pe/oracle.exe
      FDISBULL_PE_EVIDENCE: ${{ github.workspace }}/native-evidence/pe/artifacts
      FDISBULL_REQUIRE_PE: "1"
      FDISBULL_DOSBOX: ${{ github.workspace }}/.native/linux-dosbox/dosbox-x
      FDISBULL_MACHINE_QEMU: ${{ github.workspace }}/.native/pe/qemu-9.2.4/build/qemu-system-x86_64
      FDISBULL_DOS_KERNEL: ${{ github.workspace }}/.native/pe/linux-amd64
      FDISBULL_DOS_INITRAMFS: ${{ github.workspace }}/.native/pe/dos-runtime.cpio.gz
      FDISBULL_MACHINE_EVIDENCE: ${{ github.workspace }}/native-evidence/unified/boot
      FDISBULL_DOS_QEMU_EVIDENCE: ${{ github.workspace }}/native-evidence/unified/dos
      FDISBULL_REQUIRE_MACHINE: "1"
      FDISBULL_REQUIRE_DOS_QEMU: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v4
        with:
          name: linux-dosbox-layers
          path: .native/linux-dosbox
      - uses: actions/download-artifact@v4
        with:
          name: native-debugger-layers-backend
          path: .native/linux-dosbox/evidence
      - name: Check the source-built Linux DOSBox
        run: |
          chmod +x "$FDISBULL_DOSBOX"
          sha256sum "$FDISBULL_DOSBOX"
          ldd "$FDISBULL_DOSBOX"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          receipt=json.loads(Path('.native/linux-dosbox/evidence/backend-identity.json').read_text())
          assert receipt['source_commit']==os.environ['GITHUB_SHA']
          assert receipt['backend_sha256']==hashlib.sha256(Path(os.environ['FDISBULL_DOSBOX']).read_bytes()).hexdigest()
          PY
      - name: Build and install the release wheel
        run: |
          python -m pip install ".[test]" build
          python -m build --wheel --outdir .native/pe/packages
          python scripts/check_dist.py .native/pe/packages/*.whl
          python -m pip install --force-reinstall --no-deps .native/pe/packages/*.whl
      - name: Build pinned QEMU with the upstream user-mode IRET fix
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libpixman-1-dev ninja-build
          mkdir -p native-evidence/pe
          curl --fail --location --retry 3 https://download.qemu.org/qemu-9.2.4.tar.xz \
            --output .native/pe/qemu-9.2.4.tar.xz
          echo 'f3cc1c4eabfdb288218ac3e33763dbe9e276d8bc890b867a2335d58de2ddd39a  .native/pe/qemu-9.2.4.tar.xz' | sha256sum --check
          tar -xJf .native/pe/qemu-9.2.4.tar.xz -C .native/pe
          mkdir .native/pe/qemu-9.2.4/build
          cd .native/pe/qemu-9.2.4/build
          ../configure --target-list=x86_64-softmmu --disable-docs --disable-user \
            --disable-gtk --disable-sdl --disable-vnc --disable-curses --disable-werror
          ninja -j2 qemu-system-x86_64
          ./qemu-system-x86_64 --version
      - name: Build a trusted Wine root filesystem
        run: |
          docker build --platform linux/amd64 -f experimental/wine/ci/Containerfile -t fdisbull-pe-ci .
          docker run --rm --network none \
            --mount "type=bind,source=$FDISBULL_DOSBOX,target=/opt/dosbox-x,readonly" \
            fdisbull-pe-ci sh -ec 'ldd /opt/dosbox-x > /tmp/dos-libraries; cat /tmp/dos-libraries; ! grep -q "not found" /tmp/dos-libraries'
          docker create --name fdisbull-pe-export fdisbull-pe-ci /bin/true
          docker cp fdisbull-pe-export:/opt/ci/oracle.exe .native/pe/oracle.exe
          docker cp fdisbull-pe-export:/opt/ci/runtime-packages.txt native-evidence/pe/runtime-packages.txt
          docker export --output .native/pe/rootfs.tar fdisbull-pe-export
          docker rm fdisbull-pe-export
          docker image inspect --format '{{.Id}}' fdisbull-pe-ci > native-evidence/pe/rootfs-image.txt
      - name: Check the pinned kernel and prepare the packaged guest runtime
        run: |
          curl --fail --location --retry 3 \
            https://deb.debian.org/debian/dists/bookworm/main/installer-amd64/current/images/netboot/debian-installer/amd64/linux \
            --output "$FDISBULL_PE_KERNEL"
          echo "d8808aa4ca188560da1e6d749dcb930c87a5fd8b11ebff1f3fa6d728af35203d  $FDISBULL_PE_KERNEL" | sha256sum --check
          python experimental/wine/ci/build_runtime.py \
            --rootfs-tar .native/pe/rootfs.tar --base .native/pe/base.cpio.gz \
            --output "$FDISBULL_PE_INITRAMFS" > native-evidence/pe/runtime-preparation.json
          python -m fdisbull.dos_runtime \
            --base-initramfs .native/pe/base.cpio.gz \
            --dosbox "$FDISBULL_DOSBOX" --output "$FDISBULL_DOS_INITRAMFS" \
            > native-evidence/pe/dos-runtime-preparation.json
          rm .native/pe/rootfs.tar .native/pe/base.cpio.gz
      - name: Record exact inputs and installed package identity
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import fdisbull
          assert 'site-packages' in fdisbull.__file__, fdisbull.__file__
          def identity(path):
              path=Path(path)
              with path.open('rb') as stream:
                  digest=hashlib.file_digest(stream,'sha256').hexdigest()
              return {'path':str(path),'sha256':digest,'size':path.stat().st_size}
          receipt={'source_commit':os.environ['GITHUB_SHA'],
                   'version':fdisbull.__version__,'installed_module':fdisbull.__file__,
                   'inputs':{key:identity(os.environ[key]) for key in (
                       'FDISBULL_PE_QEMU','FDISBULL_PE_KERNEL','FDISBULL_PE_INITRAMFS','FDISBULL_PE_FIXTURE',
                       'FDISBULL_DOSBOX','FDISBULL_DOS_INITRAMFS')},
                   'wheel':identity(next(Path('.native/pe/packages').glob('*.whl')))}
          Path('native-evidence/pe/backend-identity.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Require real PE64 watches, layers and native-state acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s tests/test_wine_debugger.py tests/test_wine_advanced.py tests/test_wine_doctor.py -o pythonpath= \
            --junitxml=native-evidence/pe/tests.xml 2>&1 | tee native-evidence/pe/tests.log
      - name: Require real DOS-in-QEMU and boot-context acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence/unified
          python -m pytest -q -s tests/test_dos_qemu.py tests/test_qemu_machine.py -o pythonpath= \
            --junitxml=native-evidence/unified/tests.xml 2>&1 | tee native-evidence/unified/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debugger-pe64
          path: native-evidence/pe/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-debugger-unified
          path: native-evidence/unified/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fdisbull-pe-tested-wheel
          path: .native/pe/packages/*.whl
          if-no-files-found: error
