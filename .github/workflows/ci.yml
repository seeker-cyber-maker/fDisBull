name: Tests and tool packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tool and build dependencies
        run: python -m pip install ".[test]" build
      - name: Run tests
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check wheel and source distribution contents
        run: python scripts/check_dist.py
      - name: Build tool-only source ZIP
        run: python scripts/build_release.py
      - name: Check all release artifacts
        run: python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: fdisbull-tool-packages
          path: dist/*
          if-no-files-found: error
