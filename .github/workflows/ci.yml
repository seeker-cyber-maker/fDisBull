name: OVH manual bootstrap
run-name: "OVH bootstrap ${{ inputs.nonce }}"

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: Unique reconciliation nonce
        required: true
        type: string
      candidate_sha:
        description: Full candidate commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fdisbull-ovh-ci
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, Linux, X64, fdisbull-ovh-ca-gh1]
    timeout-minutes: 10
    container:
      image: python:3.13.5-bookworm@sha256:6c6b3c2deae72b980c4323738be824884c9a2e17588c93db82612f8a3072be88
      options: --cpus=2 --memory=2g --pids-limit=512 --volume /var/lib/fdisbull-ci/results/github:/ci-host-results --label fdisbull.ci.provider=github
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Verify bounded bootstrap
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BOOTSTRAP_NONCE: ${{ inputs.nonce }}
          BOOTSTRAP_OUTPUT: artifacts/github-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python control/scripts/ci/github-bootstrap.py
          --candidate candidate --source-sha "$CANDIDATE_SHA"
          --nonce "$BOOTSTRAP_NONCE" --output "$BOOTSTRAP_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: github-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/github-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          include-hidden-files: false
